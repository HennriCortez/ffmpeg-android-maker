name: Build Android FFmpeg ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - name: Export Android paths
        run: |
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            curl \
            git \
            libtool \
            make \
            meson \
            nasm \
            ninja-build \
            pkg-config \
            unzip \
            xz-utils

      - name: Build arm64-v8a
        run: |
          chmod +x ffmpeg-android-maker.sh
          ./ffmpeg-android-maker.sh \
            --target-abis=arm64-v8a \
            --android-api-level=21

      - name: Validate MediaCodec
        shell: bash
        run: |
          set -euo pipefail
      
          ffmpeg_bin="$(find build -type f -path '*arm64-v8a*/bin/ffmpeg' -print -quit)"
      
          if [[ -z "$ffmpeg_bin" ]]; then
            echo "Android ARM64 FFmpeg executable was not found." >&2
            exit 1
          fi
      
          echo "Found FFmpeg: $ffmpeg_bin"
      
          echo "Checking ELF architecture..."
          readelf -h "$ffmpeg_bin" | tee elf-header.txt
      
          grep -Eiq 'AArch64|ARM64' elf-header.txt || {
            echo "FFmpeg is not an ARM64 executable." >&2
            exit 1
          }
      
          echo "Checking FFmpeg configuration..."
      
          config_files=()
      
          while IFS= read -r file; do
            config_files+=("$file")
          done < <(
            find . -type f \
              \( -name config.h -o -name config_components.h -o -name config.log \) \
              -path '*arm64-v8a*' \
              -print
          )
      
          if [[ "${#config_files[@]}" -eq 0 ]]; then
            echo "FFmpeg configuration files were not found." >&2
            find build -type f -path '*arm64-v8a*' -print
            exit 1
          fi
      
          printf 'Configuration files:\n'
          printf '  %s\n' "${config_files[@]}"
      
          cat "${config_files[@]}" | tee ffmpeg-configuration.txt
      
          grep -Eiq 'CONFIG_MEDIACODEC[[:space:]]+1|enable-mediacodec' \
            ffmpeg-configuration.txt || {
            echo "MediaCodec was not enabled in FFmpeg configuration." >&2
            exit 1
          }
      
          grep -Eiq 'CONFIG_JNI[[:space:]]+1|enable-jni' \
            ffmpeg-configuration.txt || {
            echo "JNI support was not enabled in FFmpeg configuration." >&2
            exit 1
          }
      
          echo "Checking MediaCodec symbols and strings..."
      
          strings "$ffmpeg_bin" | tee ffmpeg-strings.txt
      
          grep -Eiq 'mediacodec|MediaCodec' ffmpeg-strings.txt || {
            echo "MediaCodec references were not found in the Android FFmpeg binary." >&2
            exit 1
          }
      
          echo "Static MediaCodec validation passed."

      - name: Package Android payload
        run: |
          mkdir -p android-payload/arm64-v8a
          ffmpeg_bin="$(find build -type f -path '*arm64-v8a*/ffmpeg' | head -n 1)"
          cp "$ffmpeg_bin" android-payload/arm64-v8a/ffmpeg
          cp -r output/lib/arm64-v8a android-payload/arm64-v8a/lib
          cp stats/arm64-v8a-hwaccels.txt android-payload/arm64-v8a/
          cp stats/arm64-v8a-decoders.txt android-payload/arm64-v8a/

      - name: Upload Android payload
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64
          path: android-payload
