name: Build Android FFmpeg ARM64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK and NDK
        run: |
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;29.0.14206865"

      - name: Export Android paths
        run: |
          echo "ANDROID_SDK_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/29.0.14206865" >> "$GITHUB_ENV"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            build-essential \
            cmake \
            curl \
            git \
            libtool \
            make \
            meson \
            nasm \
            ninja-build \
            pkg-config \
            unzip \
            xz-utils

      - name: Build arm64-v8a
        run: |
          chmod +x ffmpeg-android-maker.sh
          ./ffmpeg-android-maker.sh \
            --target-abis=arm64-v8a \
            --android-api-level=21

      - name: Validate MediaCodec
        shell: bash
        run: |
          set -euo pipefail
      
          ffmpeg_bin="$(find build -type f -path '*arm64-v8a*/bin/ffmpeg' -print -quit)"
      
          if [[ -z "$ffmpeg_bin" ]]; then
            echo "Android ARM64 FFmpeg executable was not found." >&2
            find build -type f -name ffmpeg -print
            exit 1
          fi
      
          echo "Found FFmpeg: $ffmpeg_bin"
      
          echo "Checking ELF architecture..."
      
          if command -v readelf >/dev/null 2>&1; then
            readelf_bin="readelf"
          elif command -v llvm-readelf >/dev/null 2>&1; then
            readelf_bin="llvm-readelf"
          else
            echo "Neither readelf nor llvm-readelf is installed." >&2
            exit 1
          fi
      
          "$readelf_bin" -h "$ffmpeg_bin" | tee elf-header.txt
      
          grep -Eiq 'AArch64|ARM64' elf-header.txt || {
            echo "FFmpeg is not an ARM64 executable." >&2
            exit 1
          }
      
          echo "Searching FFmpeg configuration files..."
      
          config_files=()
      
          while IFS= read -r file; do
            config_files+=("$file")
          done < <(
            find . -type f \
              \( \
                -name config.h \
                -o -name config_components.h \
                -o -name config.log \
              \) \
              -print
          )
      
          if [[ "${#config_files[@]}" -eq 0 ]]; then
            echo "No FFmpeg configuration files were found." >&2
            find . -type f | sort
            exit 1
          fi
      
          printf 'Found configuration files:\n'
          printf '  %s\n' "${config_files[@]}"
      
          : > ffmpeg-configuration.txt
      
          for config_file in "${config_files[@]}"; do
            {
              echo
              echo "===== ${config_file} ====="
              cat "$config_file"
            } >> ffmpeg-configuration.txt
          done
      
          cat ffmpeg-configuration.txt
      
          echo "Checking CONFIG_MEDIACODEC..."
      
          grep -Eq '^[[:space:]]*#?[[:space:]]*define[[:space:]]+CONFIG_MEDIACODEC[[:space:]]+1' \
            ffmpeg-configuration.txt || {
            echo "ERROR: FFmpeg was not configured with MediaCodec." >&2
            exit 1
          }
      
          echo "Checking CONFIG_JNI..."
      
          grep -Eq '^[[:space:]]*#?[[:space:]]*define[[:space:]]+CONFIG_JNI[[:space:]]+1' \
            ffmpeg-configuration.txt || {
            echo "ERROR: FFmpeg was not configured with JNI support." >&2
            exit 1
          }
      
          echo "Checking MediaCodec references in the binary..."
      
          strings "$ffmpeg_bin" | tee ffmpeg-strings.txt
      
          grep -Eiq 'mediacodec|MediaCodec' ffmpeg-strings.txt || {
            echo "ERROR: MediaCodec references were not found in the FFmpeg binary." >&2
            exit 1
          }
      
          echo "Static MediaCodec validation passed."

      - name: Package Android payload
        shell: bash
        run: |
          set -euo pipefail
      
          ffmpeg_bin="output/bin/arm64-v8a/ffmpeg"
      
          if [[ ! -f "$ffmpeg_bin" ]]; then
            ffmpeg_bin="$(find build -type f \
              -path '*arm64-v8a*/bin/ffmpeg' \
              -print -quit)"
          fi
      
          if [[ -z "$ffmpeg_bin" || ! -f "$ffmpeg_bin" ]]; then
            echo "Android ARM64 FFmpeg executable was not found." >&2
            find build output -type f -name ffmpeg -print 2>/dev/null || true
            exit 1
          fi
      
          test -f "output/lib/arm64-v8a/libavcodec.so"
          test -f "output/lib/arm64-v8a/libavformat.so"
          test -f "output/lib/arm64-v8a/libavutil.so"
      
          mkdir -p android-payload/arm64-v8a/bin
          mkdir -p android-payload/arm64-v8a/lib
          mkdir -p android-payload/arm64-v8a/include
      
          cp "$ffmpeg_bin" \
            android-payload/arm64-v8a/bin/ffmpeg
      
          cp -r output/lib/arm64-v8a/. \
            android-payload/arm64-v8a/lib/
      
          if [[ -d "output/include/arm64-v8a" ]]; then
            cp -r output/include/arm64-v8a/. \
              android-payload/arm64-v8a/include/
          fi
      
          if [[ -d stats ]]; then
            cp -r stats android-payload/arm64-v8a/stats
          fi
      
          chmod +x android-payload/arm64-v8a/bin/ffmpeg
      
          find android-payload -type f -print | sort
          
      - name: Upload Android payload
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-arm64
          path: android-payload
          if-no-files-found: error
